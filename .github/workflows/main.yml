name: Deploy to cPanel via FTP

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [strapi-update]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy may touch the FTP server at a time. Strapi often fires many
# webhooks within seconds; overlapping uploads corrupted the server-side sync
# state and caused "553 Can't open that file" on every run since 2026-10-19.
# A running deploy is never cancelled mid-upload; newer triggers replace any
# queued one, so the latest content still gets deployed.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

env:
  # Fresh state file name: the old .ftp-deploy-sync-state.json on the server
  # lists folders that no longer exist. With a new name, the first run uploads
  # every file again (deleting nothing), then later runs sync as usual.
  FTP_STATE_NAME: .ftp-deploy-sync-state-v2.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to FTP (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: samamusicarts.com
          username: seattle@seattle.samamusicarts.org
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          state-name: ${{ env.FTP_STATE_NAME }}

      - name: Wait before retry 1
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to FTP (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: samamusicarts.com
          username: seattle@seattle.samamusicarts.org
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          state-name: ${{ env.FTP_STATE_NAME }}

      - name: Wait before retry 2
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 30

      - name: Deploy to FTP (attempt 3, final)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: samamusicarts.com
          username: seattle@seattle.samamusicarts.org
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
          state-name: ${{ env.FTP_STATE_NAME }}
